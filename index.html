<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selección fotos RGC 2025</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--acc:#d6336c;--line:#e2e0da}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#f1f0ec;--mut:#9b9a94;--card:#222220;--acc:#ff6b9a;--line:#333}}
:root[data-theme="dark"]{--bg:#161615;--fg:#f1f0ec;--mut:#9b9a94;--card:#222220;--acc:#ff6b9a;--line:#333}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:17px;margin:0 8px 0 0}
.voters button,.filters button,.tools button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.voters button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.filters button.on,.tools button.on{outline:2px solid var(--acc)}
.voters input{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 8px;border-radius:8px;width:120px;font:inherit}
.count{color:var(--mut);margin-left:auto}
main{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{position:relative;background:var(--card);border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--line)}
.card.sel{border-color:var(--acc)}
.badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px}
.votes{display:flex;gap:4px;padding:6px 8px;font-size:12px;color:var(--mut);min-height:26px;flex-wrap:wrap}
.votes span{background:var(--line);border-radius:6px;padding:1px 6px}
.hidden{display:none}
.hint{padding:0 16px 16px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Selección RGC 2025</h1>
  <div class="voters" id="voters"></div>
  <div class="filters">
    <button data-f="all" class="on">Todas</button>
    <button data-f="voted">Votadas</button>
    <button data-f="top">Más votadas (2+)</button>
  </div>
  <div class="tools">
    <button id="exp">Exportar CSV</button>
    <button id="reset">Borrar votos</button>
  </div>
  <span class="count" id="count"></span>
</header>
<main id="grid"></main>
<p class="hint">Elige quién vota arriba y toca cada foto para marcarla o desmarcarla para esa persona. Los votos se guardan en este navegador.</p>
<script src="photos.js"></script>
<script>
(function(){
  var KEY = 'rgc2025-votos';
  var filter = 'all';
  var votes = {};
  try { votes = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { votes = {}; }
  var grid = document.getElementById('grid');
  var countEl = document.getElementById('count');
  var NOMBRES = ['Sofía Cantillo', 'Juan Mazuera', 'David Vanegas', 'Juan Roa'];
  var current = 0;
  var voters = document.getElementById('voters');
  var voterBtns = [];

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(votes)); } catch(e) {} }
  function nameOf(i){ return NOMBRES[i]; }

  // botones para elegir quién vota
  NOMBRES.forEach(function(nombre, i){
    var b = document.createElement('button');
    b.textContent = nombre;
    voters.appendChild(b);
    voterBtns.push(b);
    b.addEventListener('click', function(){ current = i; render(); });
  });
  function refreshVoterBtns(){
    voterBtns.forEach(function(b, i){
      b.textContent = nameOf(i);
      b.className = (i === current) ? 'on' : '';
    });
  }

  function whoVoted(file){
    var out = [];
    for (var i = 0; i < 4; i++) if (votes[file] && votes[file][i]) out.push(nameOf(i));
    return out;
  }

  function render(){
    refreshVoterBtns();
    grid.innerHTML = '';
    var shown = 0, total = 0, votedCount = 0;
    FOTOS.forEach(function(file){
      var who = whoVoted(file);
      var n = who.length;
      if (n) votedCount++;
      var show = filter === 'all' || (filter === 'voted' && n > 0) || (filter === 'top' && n >= 2);
      total++;
      if (!show) return;
      shown++;
      var card = document.createElement('div');
      card.className = 'card' + (votes[file] && votes[file][current] ? ' sel' : '');
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = file;
      img.src = 'fotos/' + file;
      var badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = n;
      var vs = document.createElement('div');
      vs.className = 'votes';
      who.forEach(function(w){ var s = document.createElement('span'); s.textContent = w; vs.appendChild(s); });
      card.appendChild(img); card.appendChild(badge); card.appendChild(vs);
      card.addEventListener('click', function(){
        votes[file] = votes[file] || {};
        votes[file][current] = !votes[file][current];
        if (!votes[file][current]) delete votes[file][current];
        if (!Object.keys(votes[file]).length) delete votes[file];
        save(); render();
      });
      grid.appendChild(card);
    });
    countEl.textContent = votedCount + ' con votos · ' + shown + ' mostradas de ' + total;
    document.querySelectorAll('.filters button').forEach(function(b){
      b.classList.toggle('on', b.dataset.f === filter);
    });
  }

  document.querySelectorAll('.filters button').forEach(function(b){
    b.addEventListener('click', function(){ filter = b.dataset.f; render(); });
  });

  document.getElementById('exp').addEventListener('click', function(){
    var rows = ['foto,' + [0,1,2,3].map(nameOf).join(',') + ',total'];
    FOTOS.forEach(function(file){
      var v = [0,1,2,3].map(function(i){ return votes[file] && votes[file][i] ? 1 : 0; });
      var t = v.reduce(function(a,b){ return a + b; }, 0);
      if (t) rows.push(file + ',' + v.join(',') + ',' + t);
    });
    var blob = new Blob([rows.join('\n')], {type: 'text/csv'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'votos-rgc-2025.csv';
    a.click();
  });

  document.getElementById('reset').addEventListener('click', function(){
    if (confirm('¿Borrar todos los votos de este navegador?')) { votes = {}; save(); render(); }
  });

  render();
})();
</script>
</body>
</html>
